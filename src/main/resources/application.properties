spring.application.name=lacasa-fest-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lacasa_fest?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Token para consultar GET /api/orcamentos. Nunca publique este valor no código.
app.admin-token=${ADMIN_TOKEN}

# Numero de WhatsApp da La Casa Fest (formato: codigo do pais + DDD + numero, sem espaco/simbolo).
# Ex: 5511999999999. Usado pra montar o link wa.me na resposta do POST /api/orcamentos.
app.whatsapp-numero=${WHATSAPP_NUMERO:5511977941642}

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
